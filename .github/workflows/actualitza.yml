name: Actualitza horaris

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minuts (GitHub pot endarrerir-ho uns minuts)
  workflow_dispatch:          # botó "Run workflow" per executar-lo a mà

permissions:
  contents: write

concurrency:
  group: horaris
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Llegeix els PDF i genera els calendaris
        env:
          WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python genera.py
      - name: Desa els canvis
        run: |
          git config user.name "horaris-bot"
          git config user.email "horaris-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sense canvis."
          else
            git commit -m "Actualitza horaris"
            git push
          fi
